<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portafolio | Ingeniería Informática</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--s1:#111a2c;--s2:#17223a;--line:#27324b;--ink:#eee9df;--soft:#c9ccd6;--muted:#97a1b5;--gold:#d4b483;--gold2:#ecd9b6}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
 background-image:radial-gradient(800px 480px at 90% -8%,#d4b4831c,transparent),radial-gradient(600px 400px at -10% 25%,#4b6cb71a,transparent);background-repeat:no-repeat}
a{color:var(--gold)}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.serif,h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500}
.w{max-width:1080px;margin:auto;padding:0 24px}
.top{position:sticky;top:0;z-index:10;background:#0b1220d9;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .w{display:flex;align-items:center;justify-content:space-between;height:62px;gap:14px}
.logo{font:italic 1.25rem Georgia,serif;color:var(--gold2)}
.top nav{display:flex;gap:2px;flex-wrap:wrap}
.top nav a{color:var(--muted);text-decoration:none;padding:7px 13px;font-size:.84rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;border-radius:6px}
.top nav a:hover{color:var(--gold2)}
.hero{padding:80px 0 40px;scroll-margin-top:62px}
.hero .w{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:center}
.kicker{font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:clamp(2.5rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.02em;margin:16px 0 6px}
.role{font:italic 1.5rem Georgia,serif;color:var(--gold2);margin:0 0 20px}
.bio{color:var(--soft);font-size:1.06rem;max-width:560px;margin:0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 22px}
.btn{display:inline-block;background:var(--gold);color:#18130a;border:1px solid var(--gold);padding:12px 24px;font-weight:700;font-size:.88rem;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;border-radius:3px;font-family:inherit;transition:.2s}
.btn:hover{background:var(--gold2)}.btn.alt{background:transparent;color:var(--ink);border-color:#4a5675}.btn.alt:hover{border-color:var(--gold);color:var(--gold2)}
.links{display:flex;gap:20px;flex-wrap:wrap;font-size:.92rem;color:var(--muted)}
.photo{justify-self:center;position:relative;width:100%;max-width:310px}
.photo::before{content:"";position:absolute;inset:16px -16px -16px 16px;border:1px solid var(--gold);border-radius:170px 170px 18px 18px;opacity:.55}
.frame{position:relative;aspect-ratio:4/5;border-radius:170px 170px 18px 18px;overflow:hidden;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--line);display:grid;place-items:center}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mono{font:italic 5.5rem Georgia,serif;color:var(--gold);opacity:.8}
.stats{display:flex;gap:40px;margin-top:44px;padding-top:26px;border-top:1px solid var(--line);flex-wrap:wrap}
.stat b{display:block;font:2.1rem Georgia,serif;color:var(--gold2);line-height:1.1}.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
section.s{padding:84px 0 4px;scroll-margin-top:62px}
.sh .n{font:600 .78rem ui-monospace,Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.15em}
h2{margin:4px 0 8px;font-size:2.2rem;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0 0 32px;max-width:620px}
.cv{display:grid;grid-template-columns:310px 1fr;gap:22px}
.box{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:28px}
h4{margin:22px 0 8px;font:700 .72rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.box h4:first-child,.card h4:first-child{margin-top:0}
.box ul{margin:0;padding-left:18px;color:var(--soft)}.box li{margin:5px 0}
.chip{display:inline-block;border:1px solid #3a4766;border-radius:99px;padding:3px 13px;font-size:.84rem;margin:3px 4px 3px 0;color:var(--soft)}
.side p{margin:0 0 8px;font-size:.93rem;word-break:break-word}
.edu{margin:0 0 16px}.edu b{display:block;font:1.08rem Georgia,serif;font-weight:500}.edu span{display:block;color:var(--muted);font-size:.9rem}.edu .y{color:var(--gold);font-size:.8rem;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.25s}
.proj:hover{border-color:#52617f;transform:translateY(-4px);box-shadow:0 20px 50px #0008}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,var(--s2),#0e1626);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb i{font:italic 3rem Georgia,serif;color:var(--gold);opacity:.5}
.pb{padding:22px}
.card h3{margin:0 0 2px;font-size:1.3rem}.card p{margin:0 0 8px;color:var(--soft)}
.meta{font-size:.84rem;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tab{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 18px;font:600 .84rem inherit;font-family:inherit;cursor:pointer;letter-spacing:.04em}
.tab:hover{color:var(--ink)}.tab[aria-pressed="true"]{background:var(--gold);color:#18130a;border-color:var(--gold)}
details.act{background:var(--s1);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
details.act[open]{border-color:#52617f}
details.act summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 22px;flex-wrap:wrap}
details.act summary::-webkit-details-marker{display:none}
details.act summary::after{content:"+";margin-left:auto;font-size:1.5rem;color:var(--gold)}
details.act[open] summary::after{content:"–"}
.act h3{margin:0;font-size:1.15rem}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid #4a5675;border-radius:4px;padding:2px 9px;color:var(--gold2)}
.body{padding:4px 22px 22px;border-top:1px solid var(--line)}
.body ul{margin:4px 0 8px;padding-left:20px;color:var(--soft)}.body p{margin:0 0 8px;color:var(--soft)}
.reflex{background:var(--bg);border-left:3px solid var(--gold);border-radius:6px;padding:12px 16px;margin-top:14px}
.todo{background:#f5b84b22;color:#f5b84b;border-radius:4px;padding:0 5px}
footer{margin-top:100px;border-top:1px solid var(--line);padding:34px 0;text-align:center;color:var(--muted);font-size:.88rem}
.hidden{display:none!important}
@media(max-width:820px){.hero .w,.cv{grid-template-columns:1fr}.photo{order:-1;max-width:230px}.hero{padding-top:40px}.top nav a{padding:6px 7px;font-size:.7rem}.logo{display:none}.stats{gap:26px}}
@media print{:root{color-scheme:light}body{background:#fff!important;color:#000}.top,.hero,footer,.noprint,section.s:not(#cv){display:none!important}
 .cv{display:block}.box{background:#fff;border:0;padding:0 0 12px;color:#000}.box ul,.edu span,.side p{color:#000}h4,.edu .y{color:#555}.chip{border-color:#999;color:#000}}
</style>
</head>
<body>
<header class="top"><div class="w">
  <div class="logo" id="logo"></div>
  <nav aria-label="Secciones"><a href="#inicio">Inicio</a><a href="#cv">CV</a><a href="#proyectos">Proyectos</a><a href="#actividades">Actividades</a></nav>
</div></header>
 
<section class="hero" id="inicio"><div class="w">
  <div>
    <div class="kicker" id="h-sem"></div>
    <h1 id="h-name"></h1>
    <p class="role" id="h-role"></p>
    <p class="bio" id="h-bio"></p>
    <div class="cta"><a class="btn" href="#proyectos">Ver proyectos</a><a class="btn alt" href="#cv">Mi CV</a></div>
    <div class="links" id="h-links"></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="photo"><div class="frame"><span class="mono" id="mono"></span><img id="h-foto" class="hidden" alt="" width="310" height="388"></div></div>
</div></section>
 
<main class="w">
  <section class="s" id="cv"></section>
  <section class="s" id="proyectos"></section>
  <section class="s" id="actividades"></section>
</main>
<footer id="foot"></footer>
 
<script>
/* =====================================================================
   ✏️ EDITA SOLO ESTA PARTE. Lo que está entre [corchetes] debes
   reemplazarlo con tu información real.
 
   🖼️ IMÁGENES (todas se guardan en la MISMA carpeta que index.html):
      • Tu foto: campo "foto" de PERFIL (ej. "foto.jpg")
      • Imagen de cada proyecto: campo "imagen" (ej. "proyecto1.png")
      Si dejas un campo vacío "", se muestra un diseño elegante por defecto.
   ===================================================================== */
const PERFIL = {
  foto: "Retrato.png",                                   // 🖼️ TU FOTO DE PERFIL
  nombre: "Cristian Miranda Sánchez",                       // tu nombre completo
  semestre: "Tecnológico de San Felipe del Progreso · 5.º semestre",
  rol: "Ingeniería Informática",
  bio: "Soy estudiante de Ingeniería Informática apasionado por la tecnología, el desarrollo de software y la creación de soluciones innovadoras. Cuento con conocimientos en programación, desarrollo web, bases de datos y tecnologías de la información. Me caracterizo por mi pensamiento lógico, creatividad, capacidad para resolver problemas y determinación para superar retos tecnológicos. Mi objetivo es transformar ideas en proyectos funcionales, fortalecer mis habilidades y convertirme en un profesional capaz de desarrollar soluciones eficientes que generen un impacto positivo."
};
 
const CV = {
  contacto: [
    { texto: "cm127662@gmail.com"},
    { texto: "San Felipe del Progreso, Estado de México" },
    // { texto: "Tel. 7121-583544" },                 // quita // para mostrar tu teléfono
    // { texto: "GitHub", url: "https://github.com/tu-usuario" },
    // { texto: "LinkedIn", url: "https://linkedin.com/in/tu-usuario" }
  ],
  pdf: "cv.pdf",                                      // tu CV en PDF, misma carpeta
  educacion: [
    { periodo: "2024 – Actualmente", titulo: "Ingeniería Informática", lugar: "Tecnológico de San Felipe del Progreso" },
    { periodo: "2020 – 2023", lugar: "Escuela Preparatoria Oficial Anexa a la Normal" }
  ],
  habilidades: ["Trabajo en equipo", "Programación y desarrollo web", "Interés en nuevas tecnologías",  "Creatividad", "Comunicación"],
  tecnologias: ["Java", "PSeInt", "HTML / CSS", "JavaScript", "Astro", "FASTAPI", "Bases de datos"],
  idiomas: [],                                        // ej. ["Inglés: B1"]
  cursos: [
    { nombre: "Oracle Academy – Database Foundations", detalle: "Fundamentos de bases de datos, conceptos básicos de SQL y manejo de información." },
    { nombre: "Curso de Huawei", detalle: "Fundamentos y tecnologías de computación en la nube y virtualización." }
  ]
};
 
const PROYECTOS = [
  { nombre: "Loteria interactiva mazahua", tipo: "Conservacion de cultura", imagen: "",        // 🖼️ ej. "proyecto1.png"
    descripcion: "Juego interactivo basado en la cultura mazahua, desarrollado para preservar y difundir tradiciones locales.",
    tecnologias: ["Python", "RFID"], enlaces: [] },
  { nombre: "Prototipo de control y análisis de consumo energético", tipo: "Proyecto académico · IoT", imagen: "",   // 🖼️ ej. "proyecto2.png"
    descripcion: "Proyecto realizado con un ESP32 y sensores para obtener información sobre el consumo eléctrico y mostrar los datos para su análisis.",
    tecnologias: ["ESP32", "Sensores IoT"], enlaces: [] },
  { nombre: "Proyectos de programación", tipo: "Creacion de proyectos", imagen: "",         // 🖼️ ej. "proyecto3.png"
    descripcion: "Desarrollo de diferentes ejercicios y proyectos escolares utilizando Java, PSeInt, HTML, CSS y JavaScript.",
    tecnologias: ["Java",  "HTML","FASTAPI","Astro"], enlaces: [] }
  // Enlaces: enlaces: [{ texto: "Repositorio", url: "https://github.com/..." }]
];
 
/* Reflexión: 100–150 palabras. El contador te avisa en cada actividad. */
const ACTIVIDADES = [
  { eje: "personal", titulo: "Proyecto de vida", fecha: "[dd/mm/aaaa]",
    contexto: "[Por qué hiciste esta actividad y qué decidiste analizar]",
    realizaste: "Definí mis objetivos personales y profesionales a 1, 3 y 5 años, con pasos para lograrlos.",
    evidencia: "[Línea de tiempo interactiva o imagen: 1, 3 y 5 años]", enlace: "",
    elementos: ["Metas SMART y prioridades", "Recursos, obstáculos y apoyos", "Indicadores para revisar avances"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿cómo se conectan mis valores con mis metas?]" },
  { eje: "personal", titulo: "Toma de decisiones", fecha: "[dd/mm/aaaa]",
    contexto: "[Qué decisión real estás considerando: formación, proyecto o práctica]",
    realizaste: "Comparé tres opciones reales mediante una matriz multicriterio.",
    evidencia: "[Matriz o visualización de decisiones]", enlace: "",
    elementos: ["Criterios ponderados y escala justificada", "Tres opciones comparadas", "Decisión razonada y riesgo principal"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿qué sesgo podría modificar mi decisión?]" },
  { eje: "aprendizaje", titulo: "Aprendizaje autorregulado", fecha: "[dd/mm/aaaa]",
    contexto: "[Qué dificultad de aprendizaje enfrentaste]",
    realizaste: "Apliqué durante una semana un ciclo de planificación, monitoreo y ajuste.",
    evidencia: "[Diario digital de aprendizaje y gráfica de progreso]", enlace: "",
    elementos: ["Diagnóstico y meta", "Plan semanal y seguimiento", "Resultado, ajuste y próxima acción"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿qué estrategia me ayudó a aprender mejor?]" },
  { eje: "aprendizaje", titulo: "Administración por proyectos", fecha: "[dd/mm/aaaa]",
    contexto: "[Qué proyecto planificaste]",
    realizaste: "Planifiqué uno de mis proyectos con responsables, hitos, riesgos y seguimiento.",
    evidencia: "[Cronograma Gantt o tablero de tareas]", enlace: "",
    elementos: ["Alcance y entregables", "Hitos, dependencias y responsables", "Matriz de riesgos y medidas"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿qué ajustaría si ocurre un imprevisto?]" },
  { eje: "profesional", titulo: "Plan de carrera", fecha: "[dd/mm/aaaa]",
    contexto: "[Qué dos perfiles de Informática te interesan]",
    realizaste: "Investigué las competencias que piden dos perfiles y las comparé con mis habilidades actuales.",
    evidencia: "[Ruta de carrera con mapa de brechas]", enlace: "",
    elementos: ["Dos perfiles y fuentes de consulta", "Comparación con mis habilidades", "Plan de formación de seis meses"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿qué competencia priorizo y por qué?]" },
  { eje: "profesional", titulo: "Ética profesional", fecha: "[dd/mm/aaaa]",
    contexto: "[Qué dilema analizaste: privacidad, IA, ciberseguridad o propiedad intelectual]",
    realizaste: "Analicé un dilema tecnológico y evalué dos cursos de acción.",
    evidencia: "[Caso multimedia y árbol de decisiones éticas]", enlace: "",
    elementos: ["Hechos, partes afectadas y dilema", "Dos cursos de acción y consecuencias", "Decisión argumentada en principios éticos"],
    reflexion: "[Escribe aquí 100–150 palabras. Guía: ¿qué responsabilidad asumiría como profesionista?]" }
];
/* ===================== FIN DE LA ZONA EDITABLE ===================== */
 
const $ = id => document.getElementById(id);
const li = a => a.map(x => `<li>${x}</li>`).join("");
const chips = a => a.map(x => `<span class="chip">${x}</span>`).join("");
const link = l => l.url ? `<a href="${l.url}" target="_blank" rel="noopener">${l.texto}</a>` : `<span class="todo">${l.texto}</span>`;
const words = t => t.trim().split(/\s+/).filter(w => !w.startsWith("[") && w.length).length;
const head = (n, t, d) => `<div class="sh"><span class="n">${n}</span><h2>${t}</h2></div><p class="lead">${d}</p>`;
 
const listo = !PERFIL.nombre.startsWith("[");
const iniciales = listo ? PERFIL.nombre.split(" ").filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase() : "</>";
$("h-sem").textContent = PERFIL.semestre;
$("h-name").textContent = PERFIL.nombre;
$("h-role").textContent = PERFIL.rol;
$("h-bio").textContent = PERFIL.bio;
$("logo").textContent = listo ? PERFIL.nombre.split(" ").slice(0, 2).join(" ") : "Portafolio";
$("mono").textContent = iniciales;
document.title = "Portafolio | " + (listo ? PERFIL.nombre : PERFIL.rol);
$("h-links").innerHTML = CV.contacto.filter(c => c.url).map(link).join("");
$("stats").innerHTML = [[PROYECTOS.length, "Proyectos"], [CV.cursos.length, "Cursos"], [ACTIVIDADES.length, "Actividades"]]
  .map(s => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join("");
if (PERFIL.foto) {
  const f = $("h-foto"); f.alt = "Foto de " + (listo ? PERFIL.nombre : "perfil");
  f.onload = () => { f.classList.remove("hidden"); $("mono").classList.add("hidden"); }; f.src = PERFIL.foto;
}
$("foot").textContent = "© " + new Date().getFullYear() + " " + (listo ? PERFIL.nombre : "") + " · Portafolio de tutoría";
 
$("cv").innerHTML = head("01", "Currículum", "Formación, habilidades y cursos.") + `
<div class="cv">
  <aside class="box side">
    <h4>Contacto</h4>${CV.contacto.map(c => `<p>${c.url ? link(c) : c.texto}</p>`).join("")}
    <h4>Habilidades</h4>${chips(CV.habilidades)}
    <h4>Tecnologías</h4>${chips(CV.tecnologias)}
    ${CV.idiomas.length ? `<h4>Idiomas</h4><ul>${li(CV.idiomas)}</ul>` : ""}
    <p class="noprint" style="margin-top:22px"><a class="btn" href="${CV.pdf}" download>Descargar PDF</a></p>
    <p class="noprint"><button class="btn alt" onclick="window.print()">Imprimir CV</button></p>
  </aside>
  <div class="box">
    <h4>Perfil profesional</h4><p style="color:var(--soft)">${PERFIL.bio}</p>
    <h4>Educación</h4>${CV.educacion.map(e => `<div class="edu"><span class="y">${e.periodo}</span><b>${e.titulo}</b><span>${e.lugar}</span></div>`).join("")}
    <h4>Cursos y certificaciones</h4>${CV.cursos.map(c => `<div class="edu"><b>${c.nombre}</b><span>${c.detalle}</span></div>`).join("")}
  </div>
</div>`;
 
$("proyectos").innerHTML = head("02", "Proyectos", "Trabajos académicos y de desarrollo.") + `<div class="grid">` +
PROYECTOS.map(p => `<article class="card proj">
  <div class="thumb"><i>${p.nombre[0]}</i>${p.imagen ? `<img src="${p.imagen}" alt="Captura del proyecto ${p.nombre}" loading="lazy" onerror="this.remove()">` : ""}</div>
  <div class="pb"><p class="meta" style="margin:0 0 4px">${p.tipo}</p>
  <h3>${p.nombre}</h3><p>${p.descripcion}</p>
  <p>${chips(p.tecnologias)}</p>
  ${p.enlaces.length ? `<p>${p.enlaces.map(link).join(" · ")}</p>` : ""}</div>
</article>`).join("") + `</div>`;
 
const EJES = { personal: "Desarrollo personal", aprendizaje: "Aprendizaje", profesional: "Identidad profesional" };
let filtro = "all";
function pintaActs() {
  $("lista").innerHTML = ACTIVIDADES.filter(a => filtro === "all" || a.eje === filtro).map(a => {
    const n = words(a.reflexion);
    return `<details class="act"><summary><span class="tag">${EJES[a.eje]}</span><h3>${a.titulo}</h3><span class="meta">${a.fecha}</span></summary>
    <div class="body">
      <h4>Contexto</h4><p>${a.contexto}</p>
      <h4>Lo que realicé</h4><p>${a.realizaste}</p>
      <h4>Evidencia</h4><p>${a.evidencia}</p><ul>${li(a.elementos)}</ul>
      <p>${a.enlace ? `<a href="${a.enlace}" target="_blank" rel="noopener">Ver evidencia →</a>` : `<span class="todo">[Agrega el enlace o archivo de la evidencia]</span>`}</p>
      <div class="reflex"><strong>Reflexión</strong><p>${a.reflexion}</p><span class="meta">${n ? n + " palabras (meta: 100–150)" : "Aún sin redactar"}</span></div>
    </div></details>`;
  }).join("");
}
$("actividades").innerHTML = head("03", "Actividades de tutoría", "Desarrollo personal, aprendizaje e identidad profesional.") +
  `<div class="tabs" role="group" aria-label="Filtrar actividades">` +
  [["all", "Todas"], ...Object.entries(EJES)].map(([k, v]) => `<button class="tab" data-f="${k}" aria-pressed="${k === "all"}">${v}</button>`).join("") +
  `</div><div id="lista"></div>`;
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-pressed", t === b));
  pintaActs();
});
pintaActs();
 
document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener("click", e => {
  const t = document.getElementById(a.getAttribute("href").slice(1));
  if (t) { e.preventDefault(); t.scrollIntoView({ behavior: "smooth", block: "start" }); }
}));
</script>
</body>
</html>
